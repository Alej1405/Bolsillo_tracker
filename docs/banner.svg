<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Bolsillo — Tu dinero, ordenado sin esfuerzo">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0edf9"/>
      <stop offset="30%" stop-color="#e0dbf2"/>
      <stop offset="60%" stop-color="#d0cbe8"/>
      <stop offset="85%" stop-color="#c1b8de"/>
      <stop offset="100%" stop-color="#b1a6d4"/>
    </linearGradient>
    <radialGradient id="orbe1"><stop offset="0%" stop-color="#9f89ab" stop-opacity=".55"/><stop offset="100%" stop-color="#9f89ab" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbe2"><stop offset="0%" stop-color="#62507a" stop-opacity=".45"/><stop offset="100%" stop-color="#62507a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbe3"><stop offset="0%" stop-color="#553d78" stop-opacity=".40"/><stop offset="100%" stop-color="#553d78" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbe4"><stop offset="0%" stop-color="#c5b6d3" stop-opacity=".70"/><stop offset="100%" stop-color="#c5b6d3" stop-opacity="0"/></radialGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="pizarra" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#57708b"/><stop offset="100%" stop-color="#45596f"/>
    </linearGradient>
    <clipPath id="marco"><rect width="1280" height="420" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#marco)">
    <rect width="1280" height="420" fill="url(#cielo)"/>
    <circle cx="120" cy="90"  r="300" fill="url(#orbe1)"/>
    <circle cx="1180" cy="150" r="280" fill="url(#orbe2)"/>
    <circle cx="260" cy="400" r="260" fill="url(#orbe3)"/>
    <circle cx="900" cy="380" r="280" fill="url(#orbe4)"/>

    <!-- Tarjeta de vidrio: el material que unifica toda la interfaz -->
    <g>
      <rect x="72" y="88" width="600" height="248" rx="24" fill="url(#vidrio)" stroke="#ffffff" stroke-opacity=".75"/>
      <text x="112" y="168" font-family="Plus Jakarta Sans, Inter, Segoe UI, system-ui, sans-serif" font-size="60" font-weight="800" fill="#0f172a" letter-spacing="-1.4">Bolsillo</text>
      <text x="112" y="212" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" fill="#334155">Tu dinero, ordenado sin esfuerzo.</text>
      <text x="112" y="245" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" fill="#475569">Lo que entra, lo que sale y lo que guardas, en un solo lugar.</text>
      <g font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="600">
        <rect x="112" y="272" width="86" height="30" rx="15" fill="#ffffff" fill-opacity=".78"/><text x="155" y="292" fill="#45596f" text-anchor="middle">React 19</text>
        <rect x="206" y="272" width="104" height="30" rx="15" fill="#ffffff" fill-opacity=".78"/><text x="258" y="292" fill="#45596f" text-anchor="middle">TypeScript</text>
        <rect x="318" y="272" width="112" height="30" rx="15" fill="#ffffff" fill-opacity=".78"/><text x="374" y="292" fill="#45596f" text-anchor="middle">Tailwind v4</text>
        <rect x="438" y="272" width="66" height="30" rx="15" fill="#ffffff" fill-opacity=".78"/><text x="471" y="292" fill="#45596f" text-anchor="middle">Vite</text>
      </g>
    </g>

    <!-- Maqueta: tarjeta de saldo y gráfico de barras, las piezas reales del UI Kit -->
    <g transform="translate(742 88)">
      <rect width="240" height="118" rx="20" fill="url(#pizarra)"/>
      <text x="24" y="36" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#ffffff" fill-opacity=".8" letter-spacing="1">TODO TU DINERO</text>
      <text x="24" y="80" font-family="Inter, system-ui, sans-serif" font-size="38" font-weight="700" fill="#ffffff">$ 1.248,50</text>
      <text x="24" y="102" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#ffffff" fill-opacity=".8">en 3 bolsillos</text>

      <g transform="translate(0 134)">
        <rect width="240" height="114" rx="20" fill="#ffffff" fill-opacity=".93"/>
        <text x="24" y="30" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0f172a">Entró y salió</text>
        <rect x="24"  y="94" width="30" height="0" fill="#15803d" rx="4"><animate attributeName="height" from="0" to="46" dur=".9s" begin=".2s" fill="freeze" calcMode="spline" keySplines=".23 1 .32 1" keyTimes="0;1" values="0;46"/><animate attributeName="y" from="94" to="48" dur=".9s" begin=".2s" fill="freeze" calcMode="spline" keySplines=".23 1 .32 1" keyTimes="0;1" values="94;48"/></rect>
        <rect x="66"  y="94" width="30" height="0" fill="#b91c1c" rx="4"><animate attributeName="height" from="0" to="32" dur=".9s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".23 1 .32 1" keyTimes="0;1" values="0;32"/><animate attributeName="y" from="94" to="62" dur=".9s" begin=".3s" fill="freeze" calcMode="spline" keySplines=".23 1 .32 1" keyTimes="0;1" values="94;62"/></rect>
        <g font-family="Inter, system-ui, sans-serif" font-size="10" fill="#64748b">
          <text x="39" y="106" text-anchor="middle">Entró</text>
          <text x="81" y="106" text-anchor="middle">Salió</text>
        </g>
        <rect x="120" y="46" width="96" height="48" rx="10" fill="#f0fdf4"/>
        <text x="132" y="66" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">Te sobró</text>
        <text x="132" y="85" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">+ 254,00</text>
      </g>
    </g>

    <g transform="translate(1010 88)" font-family="Inter, system-ui, sans-serif">
      <rect width="198" height="248" rx="20" fill="#ffffff" fill-opacity=".62" stroke="#ffffff" stroke-opacity=".7"/>
      <text x="22" y="34" font-size="12.5" font-weight="600" fill="#0f172a">Tus bolsillos</text>
      <g font-size="11.5">
        <circle cx="34" cy="66"  r="13" fill="#f0fdf4"/><text x="34" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#15803d">E</text>
        <text x="56" y="63" fill="#0f172a" font-weight="500">Mi efectivo</text><text x="56" y="77" fill="#64748b" font-size="10">Efectivo</text>
        <text x="176" y="70" text-anchor="end" font-weight="600" fill="#0f172a">420,00</text>

        <circle cx="34" cy="114" r="13" fill="#ece9f6"/><text x="34" y="118" text-anchor="middle" font-size="11" font-weight="700" fill="#7c628b">B</text>
        <text x="56" y="111" fill="#0f172a" font-weight="500">Banco</text><text x="56" y="125" fill="#64748b" font-size="10">Cuenta</text>
        <text x="176" y="118" text-anchor="end" font-weight="600" fill="#0f172a">680,50</text>

        <circle cx="34" cy="162" r="13" fill="#fef2f2"/><text x="34" y="166" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">T</text>
        <text x="56" y="159" fill="#0f172a" font-weight="500">Tarjeta Visa</text><text x="56" y="173" fill="#64748b" font-size="10">Tarjeta</text>
        <text x="176" y="166" text-anchor="end" font-weight="600" fill="#b91c1c">− 120,00</text>

        <circle cx="34" cy="210" r="13" fill="#fffbeb"/><text x="34" y="214" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">A</text>
        <text x="56" y="207" fill="#0f172a" font-weight="500">Viaje</text><text x="56" y="221" fill="#64748b" font-size="10">Ahorro</text>
        <text x="176" y="214" text-anchor="end" font-weight="600" fill="#0f172a">268,00</text>
      </g>
    </g>
  </g>
</svg>
